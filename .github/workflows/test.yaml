name: Test Archetype

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: p6m-archetypes/archetype-test-harness/.github/workflows/archetype-test.yaml@main
    with:
      harness-ref: main
      toolchain: dotnet
      # Keep in step with the TargetFramework in contents/base
      toolchain-version: "9.0.x"
    secrets: inherit
