[project]
name = "archetype-tests"
version = "0.1.0"
description = "Integration tests for dotnet-service-basic-archetype: render, inspect, build"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
markers = [
    "build: builds the generated project; requires the language toolchain (dotnet) on PATH",
]
