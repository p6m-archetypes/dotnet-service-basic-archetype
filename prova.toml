[requires]
prova = ">= 0.16"

# `prova` from the repo root runs the whole suite.
#
# jobs = 1: every proof renders the archetype and builds a container image; serial execution keeps
# those heavy units from contending for CPU, memory and Docker.
[run]
proofs = ["proofs"]
jobs = 1

[profiles.ci]
jobs = 1
format = "json"

# The org standards suite.
# NOTE (YP6M-3372): pinned to `dev`, the org's integration branch, while the studio staging is
# brought up against the whole archetype fleet — deliberate and temporary, so standards changes
# land here without waiting on a release. The suite's `p6m-pin` reminder is DUE for as long as
# this pin rides a branch (silent again on a released tag).
[dependencies]
p6m      = { git = "https://github.com/p6m-archetypes/prova-p6m-standards", branch = "dev" }
